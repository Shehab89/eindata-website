# Builds the static site and uploads it to GoDaddy cPanel hosting over FTP
# on every push to master. Needs these repository secrets
# (GitHub → Settings → Secrets and variables → Actions):
#   FTP_SERVER    e.g. ftp.eindata.nl (or the server IP shown in cPanel)
#   FTP_USERNAME  cPanel FTP account username
#   FTP_PASSWORD  cPanel FTP account password
#   FTP_DIR       optional, folder on the server; default ./public_html/
name: Deploy to eindata.nl

on:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npm run build

      - name: Upload to GoDaddy over FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          local-dir: ./out/
          server-dir: ${{ secrets.FTP_DIR || './public_html/' }}
